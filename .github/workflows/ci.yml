name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      working-directory: ./eventhub-backend
      run: mvn clean compile

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './EventHub_Frontend/package-lock.json'
    - name: Install dependencies
      working-directory: ./EventHub_Frontend
      run: npm ci
    - name: TypeScript Check
      working-directory: ./EventHub_Frontend
      run: npx tsc --noEmit
    - name: Build Frontend
      working-directory: ./EventHub_Frontend
      run: npm run build
