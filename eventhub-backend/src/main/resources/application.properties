# Removed driver-class-name to resolve "not assignable" error

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# Keep connections alive by pinging the database
spring.datasource.hikari.keepalive-time=30000

# Retire connections before Neon's 5-minute aggressive idle timeout (set to 4 minutes)
spring.datasource.hikari.max-lifetime=240000

# Don't let connections sit idle for more than 2 minutes
spring.datasource.hikari.idle-timeout=120000

# How long to wait for a connection before throwing an error
spring.datasource.hikari.connection-timeout=20000

# ===============================
# JPA CONFIG
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.format_sql=true
# Fixes PageImpl serialization issues (empty JSON objects)
spring.data.web.pageable.serialization-mode=via-dto

